<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas of European AI research and compute</title>
<style>
:root{
 --sea:#123049; --sea-deep:#0C2033; --land:#DFD6C4; --land-ctx:#4E6D82;
 --paper:#F4EFE4; --ink:#132430; --ink-2:#4A5F6D; --ivory:#FBF7EE;
 --factory:#3E9C86; --hpc:#5FA8D3; --research:#D69A22; --industry:#D9512C;
 --rule:rgba(19,36,48,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--sea);color:var(--ink);
 font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
 font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.coord{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px}
.shell{display:grid;grid-template-columns:1fr 420px;height:100dvh}
.left{display:flex;flex-direction:column;min-width:0;min-height:0}
header{padding:18px 26px 14px;color:var(--ivory);border-bottom:1px solid rgba(251,247,238,.14)}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.sub{margin:6px 0 0;font-size:13.5px;color:rgba(251,247,238,.6);max-width:70ch}
.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:11px 26px}
.chip{background:transparent;border:1px solid rgba(251,247,238,.26);color:rgba(251,247,238,.82);
 padding:5px 12px;border-radius:100px;font:inherit;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip u{text-decoration:none;opacity:.55;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ivory);border-color:var(--ivory);color:var(--sea-deep);font-weight:500}
.chip[aria-pressed="true"] u{opacity:.6}
.search{margin-left:auto;background:rgba(251,247,238,.08);border:1px solid rgba(251,247,238,.22);
 color:var(--ivory);padding:6px 12px;border-radius:100px;font:inherit;font-size:13px;width:190px}
.search::placeholder{color:rgba(251,247,238,.45)}
.mapwrap{flex:1;min-height:0;position:relative;overflow:hidden;cursor:grab}
.mapwrap.drag{cursor:grabbing}
svg.map{width:100%;height:100%;display:block;touch-action:none}
.grat{stroke:rgba(251,247,238,.10);stroke-width:.6;fill:none}
.ctx{fill:var(--land-ctx);opacity:.4}
.eu{fill:var(--land);stroke:var(--sea);stroke-width:.7}
.m{cursor:pointer}
.m .dot{stroke:var(--sea-deep);stroke-width:1.2}
.m[data-l="factory"] .dot{fill:var(--factory)}
.m[data-l="hpc"] .dot{fill:var(--hpc)}
.m[data-l="research"] .dot{fill:var(--research)}
.m[data-l="industry"] .dot{fill:var(--industry)}
.m .halo{fill:none;stroke:var(--ivory);stroke-width:1.4;opacity:0}
.m.on .halo,.m:hover .halo{opacity:.9}
.m.dim{opacity:.13;pointer-events:none}
.m .rnum{fill:var(--sea-deep);font-size:9px;font-weight:700;text-anchor:middle;pointer-events:none}
.m .lbl{fill:var(--ivory);font-size:10px;opacity:0;pointer-events:none;paint-order:stroke;
 stroke:var(--sea-deep);stroke-width:3px;stroke-linejoin:round}
.m.on .lbl,.m:hover .lbl{opacity:1}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:5px}
.zoom button{width:32px;height:32px;border-radius:8px;border:1px solid rgba(251,247,238,.28);
 background:rgba(12,32,51,.75);color:var(--ivory);font:inherit;font-size:16px;cursor:pointer}
.rail{display:flex;border-top:1px solid rgba(251,247,238,.14)}
.rankcard{flex:1;background:transparent;border:0;border-right:1px solid rgba(251,247,238,.14);
 color:rgba(251,247,238,.8);text-align:left;padding:10px 13px;font:inherit;cursor:pointer}
.rankcard:last-child{border-right:0}
.rankcard:hover,.rankcard.on{background:rgba(251,247,238,.09);color:var(--ivory)}
.rankcard b{display:block;font-size:13.5px;font-weight:600}
.rankcard span{font-size:11px;color:rgba(251,247,238,.5)}
.rankcard em{font-style:normal;color:var(--research);font-weight:700;margin-right:7px}
aside{background:var(--paper);display:flex;flex-direction:column;border-left:1px solid rgba(0,0,0,.25);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--rule);flex:0 0 auto}
.tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;
 padding:11px 4px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--research);font-weight:600}
.pane{overflow-y:auto;padding:22px 26px 60px;flex:1;min-height:0}
.eyerow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--ink-2);font-size:12.5px}
h2{margin:8px 0 2px;font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.22}
.place{margin:0 0 14px;color:var(--ink-2);font-size:13.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.tag{font-size:11.5px;padding:3px 9px;border:1px solid var(--rule);border-radius:100px;color:var(--ink-2)}
p.body{margin:0 0 18px;font-size:14.5px}
h3{font-size:12px;font-weight:600;color:var(--ink-2);margin:22px 0 8px;padding-bottom:6px;
 border-bottom:1px solid var(--rule)}
dl.spec{margin:0 0 4px;font-size:13.5px}
dl.spec div{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule)}
dl.spec dt{flex:0 0 40%;color:var(--ink-2);margin:0}
dl.spec dd{margin:0;flex:1;font-weight:500}
ul.proj{margin:0;padding:0;list-style:none}
ul.proj li{font-size:14px;padding:7px 0 7px 16px;position:relative;border-bottom:1px solid var(--rule)}
ul.proj li:before{content:"";position:absolute;left:0;top:15px;width:6px;height:1.5px;background:var(--research)}
a{color:var(--ink)}
a.site{display:inline-block;margin-top:16px;font-size:13.5px}
.why{font-size:14.5px;margin:0 0 14px}
.watch{font-size:14px;background:rgba(214,154,34,.13);border-left:2px solid var(--research);
 padding:10px 13px;margin:0 0 18px}
.note{font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--rule);margin-top:26px;padding-top:14px}
.grp{font-size:11.5px;color:var(--ink-2);margin:18px 0 4px;font-weight:600}
.grp:first-child{margin-top:0}
.row{display:flex;align-items:baseline;gap:9px;width:100%;background:transparent;border:0;
 border-bottom:1px solid var(--rule);padding:8px 2px;font:inherit;text-align:left;cursor:pointer}
.row:hover{background:rgba(19,36,48,.05)}
.row i{width:8px;height:8px;border-radius:50%;flex:0 0 auto;transform:translateY(-1px)}
.row b{font-weight:500;font-size:13.5px}
.row s{text-decoration:none;color:var(--ink-2);font-size:12px;margin-left:auto;flex:0 0 auto}
.stat{display:flex;gap:20px;margin:0 0 18px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat div b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em}
.stat div span{font-size:11.5px;color:var(--ink-2)}
.src{border-bottom:1px solid var(--rule);padding:11px 0}
.src b{font-size:13.5px;font-weight:600;display:block}
.src p{margin:3px 0 5px;font-size:13px;color:var(--ink-2)}
.src a{font-size:12px}
.chip:focus-visible,.m:focus-visible,.rankcard:focus-visible,a:focus-visible,.row:focus-visible,
.tabs button:focus-visible,.zoom button:focus-visible{outline:2px solid var(--research);outline-offset:2px}
.m{opacity:0;animation:plot .5s ease forwards}
@keyframes plot{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.m{animation:none;opacity:1}}
@media (max-width:920px){
 .shell{display:block;height:auto}
 header{padding:15px 17px 11px} h1{font-size:21px}
 .controls{padding:10px 17px} .search{margin-left:0;width:100%}
 .mapwrap{height:50vh}
 .rail{overflow-x:auto} .rankcard{flex:0 0 62%}
 aside{border-left:0;border-top:1px solid rgba(0,0,0,.25);height:auto}
 .pane{padding:20px 17px 50px;overflow:visible}
}
</style>
</head>

<script>
const DATA = {"sites": [{"id": "aif-lumi", "n": "LUMI AI Factory", "city": "Kajaani", "cn": "Finland", "lat": 64.221, "lon": 27.728, "x": 636.2, "y": 194.5, "L": "factory", "ll": "EuroHPC AI Factory", "url": "https://lumi-ai-factory.eu", "meta": [["Selected", "Dec 2024 \u2014 round 1"], ["Host", "CSC \u2013 IT Center for Science"], ["System", "LUMI-AI, beside LUMI"], ["Extras", "EU experimental platform"]], "sec": ["Cross-sector", "Manufacturing"], "b": "Provides a world-class computing environment plus new data sources, a service centre and a talent pool for rapid trials of AI solutions. The consortium is led by Finland with five other countries: Czechia, Denmark, Estonia, Norway and Poland \u2014 one of the few factories built as a genuinely cross-border effort.", "p": ["LUMI-AI system beside the existing LUMI supercomputer", "EU experimental platform for testing new AI models", "Work on data reachability and access barriers", "TildeOpen LLM (30B+) trained on LUMI and JUPITER"], "rank": 0}, {"id": "aif-hammerhai", "n": "HammerHAI", "city": "Stuttgart", "cn": "Germany", "lat": 48.746, "lon": 9.101, "x": 475.8, "y": 476.2, "L": "factory", "ll": "EuroHPC AI Factory", "url": "https://www.hammerhai.eu", "meta": [["Selected", "Dec 2024 \u2014 round 1"], ["Host", "HLRS, University of Stuttgart"], ["Partners", "GWDG, BADW-LRZ, KIT, SICOS"]], "sec": ["Manufacturing", "Engineering"], "b": "Hybrid and Advanced Machine Learning Platform for Manufacturing, Engineering, And Research. The one factory that targets its regional industry exclusively rather than spreading across sectors, reflecting Stuttgart's automotive and engineering base. Built to lower the barrier for startups and SMEs by using cloud-like technologies familiar to AI teams rather than classic HPC job submission.", "p": ["AI-optimised infrastructure at HLRS for ML, AI and hybrid HPC/AI workloads", "Workflow templates, pre-trained models and shared datasets", "End-to-end support across the AI life cycle, development through inference", "Continuing professional education for industrial users"], "rank": 0}, {"id": "aif-pharos", "n": "Pharos", "city": "Athens", "cn": "Greece", "lat": 37.984, "lon": 23.728, "x": 667.5, "y": 657.1, "L": "factory", "ll": "EuroHPC AI Factory", "url": "https://grnet.gr", "meta": [["Selected", "Dec 2024 \u2014 round 1"], ["Host", "GRNET"], ["System", "DAEDALUS, at Lavrio in Attica"], ["Partners", "Demokritos, Athena RC, NTUA, National Fund of Greece"]], "sec": ["Health", "Culture & language", "Energy", "Environment", "Climate"], "b": "Operates under the Greek Ministry of Digital Governance and exploits the DAEDALUS supercomputer. Its consortium is entirely research-led. Particular attention goes to data and AI services that produce systems compliant with the EU AI Act and sector-specific regulation.", "p": ["End-to-end support: upskilling, dataset provision, model training, business innovation", "AI Act and sector-regulation compliance services", "Greek language and cultural-heritage AI", "HPC-demanding services running against DAEDALUS"], "rank": 0}, {"id": "aif-it4lia", "n": "IT4LIA", "city": "Bologna", "cn": "Italy", "lat": 44.506, "lon": 11.32, "x": 498.3, "y": 545.6, "L": "factory", "ll": "EuroHPC AI Factory", "url": "https://it4lia-aifactory.eu", "meta": [["Selected", "Dec 2024 \u2014 round 1"], ["Host", "CINECA"], ["With", "Austria and Slovenia"], ["Scale", "40+ exaflops Linpack mixed precision"]], "sec": ["Agrifood", "Cybersecurity", "Earth observation", "Manufacturing"], "b": "Built on the Bologna Tecnopolo and the Leonardo site. The successor system is specified at four times Leonardo's power for standard applications and forty times for AI-specific workloads. One of the few factories with real international partners alongside regional and national ones.", "p": ["AI-optimised evolution of the Leonardo system", "Agrifood and earth-observation AI for Emilia-Romagna", "Sector-specific and horizontal services for SMEs", "Up-skilling programme a const W = 1000, H = 746;
const svg=document.getElementById('svg'),cam=document.getElementById('cam');
const mk=document.getElementById('markers'),pane=document.getElementById('pane');
let filter='all',query='',tab='detail',sel=null,selRank=null;
const COL={factory:'var(--factory)',hpc:'var(--hpc)',research:'var(--research)',industry:'var(--industry)'};

document.getElementById('c-all').textContent=DATA.sites.length;
for(const k in DATA.counts) document.getElementById('c-'+k).textContent=DATA.counts[k];

function dms(v,ax){const d=Math.abs(v),deg=Math.floor(d),mi=Math.round((d-deg)*60);
 return deg+'\u00B0'+String(mi).padStart(2,'0')+"' "+(ax==='lat'?(v>=0?'N':'S'):(v>=0?'E':'W'));}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

DATA.sites.sort((a,b)=>a.x-b.x).forEach((s,i)=>{
 const g=document.createElementNS('http://www.w3.org/2000/svg','g');
 g.setAttribute('class','m');g.setAttribute('data-l',s.L);g.setAttribute('tabindex','0');
 g.setAttribute('role','button');g.setAttribute('aria-label',s.n+', '+s.city);
 g.style.animationDelay=(i*10)+'ms';
 const r=s.rank?7:4.3;
 g.innerHTML='<circle class="halo" cx="'+s.x+'" cy="'+s.y+'" r="'+(r+3.4)+'"/>'+
  '<circle class="dot" cx="'+s.x+'" cy="'+s.y+'" r="'+r+'"/>'+
  (s.rank?'<text class="rnum" x="'+s.x+'" y="'+(s.y+3.2)+'">'+s.rank+'</text>':'')+
  '<text class="lbl" x="'+(s.x+r+5)+'" y="'+(s.y+3.4)+'">'+esc(s.city)+'</text>';
 g.addEventListener('click',()=>select(s.id));
 g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(s.id);}});
 mk.appendChild(g); s.el=g;
});

function applyFilter(){
 const q=query.trim().toLowerCase();
 DATA.sites.forEach(s=>{
  const okF=filter==='all'||s.L===filter;
  const hay=(s.n+' '+s.city+' '+s.cn+' '+s.sec.join(' ')+' '+s.ll).toLowerCase();
  s.hit=okF&&(!q||hay.includes(q));
  s.el.classList.toggle('dim',!s.hit);
 });
 if(tab==='browse') showBrowse();
}
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
 filter=b.dataset.f;
 document.querySelectorAll('.chip').forEach(o=>o.setAttribute('aria-pressed',o===b));
 applyFilter();
}));
document.getElementById('q').addEventListener('input',e=>{query=e.target.value;applyFilter();});

const rail=document.getElementById('rail');
DATA.rank.forEach(r=>{
 const b=document.createElement('button');b.className='rankcard';b.dataset.n=r.n;
 b.innerHTML='<b><em>'+r.n+'</em>'+esc(r.t)+'</b><span>'+esc(r.k)+'</span>';
 b.addEventListener('click',()=>{setTab('rank');showRank(r.n);});
 rail.appendChild(b);
});

document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.t)));
function setTab(t){
 tab=t;
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
 if(t==='detail'){ sel?select(sel):intro(); }
 else if(t==='browse') showBrowse();
 else if(t==='rank'){ selRank?showRank(selRank):showRankIndex(); }
 else showSources();
 pane.scrollTop=0;
}

function select(id){
 const s=DATA.sites.find(x=>x.id===id); if(!s) return;
 sel=id;
 if(tab!=='detail'){tab='detail';document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t==='detail'));}
 DATA.sites.forEach(x=>x.el.classList.toggle('on',x.id===id));
 document.querySelectorAll('.rankcard').forEach(c=>c.classList.remove('on'));
 pane.innerHTML=
  '<div class="eyerow"><span>'+esc(s.ll)+'</span><span class="coord">'+dms(s.lat,'lat')+'  '+dms(s.lon,'lon')+'</span></div>'+
  '<h2>'+esc(s.n)+'</h2>'+
  '<p class="place">'+esc(s.city)+' &middot; '+esc(s.cn)+'</p>'+
  (s.sec.length?'<div class="tags">'+s.sec.map(f=>'<span class="tag">'+esc(f)+'</span>').join('')+'</div>':'')+
  '<p class="body">'+esc(s.b)+'</p>'+
  (s.meta.length?'<h3>Key facts</h3><dl class="spec">'+s.meta.map(m=>'<div><dt>'+esc(m[0])+'</dt><dd>'+esc(m[1])+'</dd></div>').join('')+'</dl>':'')+
  '<h3>Projects and programmes</h3><ul class="proj">'+s.p.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>'+
  '<a class="site" href="'+s.url+'" target="_blank" rel="noopener">'+esc(s.url.replace(/^https?:\/\//,''))+' &rarr;</a>';
 pane.scrollTop=0;
}

function showBrowse(){
 const list=DATA.sites.filter(s=>s.hit!==false).slice().sort((a,b)=>
  a.cn.localeCompare(b.cn)||a.city.localeCompare(b.city));
 if(!list.length){pane.innerHTML='<p class="body">Nothing matches that filter. Clear the search or pick another layer.</p>';return;}
 let out='<div class="eyerow"><span>Browse by country</span><span class="coord">'+list.length+'</span></div>',cur='';
 list.forEach(s=>{
  if(s.cn!==cur){cur=s.cn;out+='<p class="grp">'+esc(cur)+'</p>';}
  out+='<button class="row" data-go="'+s.id+'"><i style="background:'+COL[s.L]+'"></i>'+
   '<b>'+esc(s.n)+'</b><s>'+esc(s.city)+'</s></button>';
 });
 pane.innerHTML=out;
 pane.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.go)));
}

function showRankIndex(){
 pane.innerHTML='<div class="eyerow"><span>Ranking</span><span>Top 5 clusters</span></div>'+
  '<h2>The five strongest AI research clusters in Europe</h2>'+
  '<p class="body">Ranked on five things together: output at top venues, access to training compute, talent density, translation into shipped models or public infrastructure, and role in the pan-European network. Pick one to see the reasoning and highlight its sites on the map.</p>'+
  DATA.rank.map(r=>'<button class="row" data-r="'+r.n+'"><i style="background:var(--research)"></i>'+
   '<b>'+r.n+'. '+esc(r.t)+'</b><s>'+esc(r.k)+'</s></button>').join('')+
  '<p class="note">Weight the criteria differently and the order changes &mdash; most obviously, weighting industrial research equally puts London first. Close behind the five: Munich, J\u00FClich, Copenhagen, Barcelona and Helsinki. Fastest riser: Sofia, where INSAIT placed first in Eastern Europe and among the top four EU institutions at CVPR 2026.</p>';
 pane.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>showRank(+b.dataset.r)));
}
function showRank(n){
 const r=DATA.rank.find(x=>x.n===n); if(!r) return;
 selRank=n;
 document.querySelectorAll('.rankcard').forEach(c=>c.classList.toggle('on',+c.dataset.n===n));
 DATA.sites.forEach(x=>x.el.classList.toggle('on',r.ids.includes(x.id)));
 pane.innerHTML='<div class="eyerow"><span>Ranked '+r.n+' of 5</span><span>'+esc(r.k)+'</span></div>'+
  '<h2>'+esc(r.t)+'</h2>'+
  '<p class="place">'+r.ids.length+' sites highlighted on the map</p>'+
  '<h3>Why it places here</h3><p class="why">'+esc(r.w)+'</p>'+
  '<h3>What could move it</h3><p class="watch">'+esc(r.c)+'</p>'+
  '<h3>Sites in this cluster</h3>'+
  r.ids.map(id=>{const s=DATA.sites.find(y=>y.id===id);return s?
   '<button class="row" data-go="'+s.id+'"><i style="background:'+COL[s.L]+'"></i><b>'+esc(s.n)+'</b><s>'+esc(s.city)+'</s></button>':''}).join('')+
  '<p class="note"><button class="row" data-back="1" style="border:0;padding:8px 0"><b>&larr; All five clusters and the criteria</b></button></p>';
 pane.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.go)));
 const bk=pane.querySelector('[data-back]'); if(bk) bk.addEventListener('click',showRankIndex);
 pane.scrollTop=0;
}

 pane.innerHTML='<div class="eyerow"><span>Sources</span><span class="coord">Sept 2026</span></div>'+
  '<h2>Where this comes from</h2>'+

  DATA.sources.map(s=>'<div class="src"><b>'+esc(s[0])+'</b><p>'+esc(s[1])+'</p>'+
   '<a href="'+s[2]+'" target="_blank" rel="noopener">'+esc(s[2].replace(/^https?:\/\//,''))+' &rarr;</a></div>').join('')+
  '<h3>Known gaps</h3><ul class="proj">'+
  '<li>NLAIF&rsquo;s physical site has not been announced; it is plotted at the SURF/Amsterdam ecosystem</li>'+

function intro(){
 pane.innerHTML='<div class="eyerow"><span>Start here</span><span class="coord">'+DATA.sites.length+' sites</span></div>'+
  '<h2>Pick a point on the map</h2>'+
  '<div class="stat"><div><b>19</b><span>AI Factories</span></div><div><b>12</b><span>EuroHPC systems</span></div>'+

intro();
applyFilter();

let z=1,tx=0,ty=0;
function apply(){cam.setAttribute('transform','translate('+tx+','+ty+') scale('+z+')');}
function zoomAt(f,cx,cy){const nz=Math.min(9,Math.max(1,z*f));
 tx=cx-(cx-tx)*(nz/z);ty=cy-(cy-ty)*(nz/z);z=nz;if(z===1){tx=0;ty=0;}apply();}
function pt(e){const r=svg.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);
 return [(e.clientX-r.left-(r.width-W*s)/2)/s,(e.clientY-r.top-(r.height-H*s)/2)/s];}
const wrap=document.getElementById('wrap');
wrap.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=pt(e);zoomAt(e.deltaY<0?1.16:1/1.16,x,y);},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(1.4,W/2,H/2);
document.getElementById('zout').onclick=()=>zoomAt(1/1.4,W/2,H/2);
document.getElementById('zres').onclick=()=>{z=1;tx=0;ty=0;apply();};
let drag=null;
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.m')||e.target.closest('button'))return;
 drag={x:e.clientX,y:e.clientY,tx,ty};wrap.classList.add('drag');wrap.setPointerCapture(e.pointerId);});
wrap.addEventListener('pointermove',e=>{if(!drag)return;
 const r=svg.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);
 tx=drag.tx+(e.clientX-drag.x)/s;ty=drag.ty+(e.clientY-drag.y)/s;apply();});
['pointerup','pointercancel'].forEach(t=>wrap.addEventListener(t,()=>{drag=null;wrap.classList.remove('drag');}));
</script>
